name: Print daily edition

on:
  schedule:
    # GitHub cron runs in UTC. The first two times cover 6:47 a.m. New York
    # time in daylight time (10:47 UTC) and standard time (11:47 UTC). GitHub
    # sometimes skips scheduled runs, so the later times are backups. The
    # script exits before calling Claude when it's before 6 a.m. in New York
    # or today's paper already exists, so the extra runs cost nothing.
    - cron: "47 10 * * *"
    - cron: "47 11 * * *"
    - cron: "17 13 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reprint today's edition even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Print the edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: npm run generate

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain site/editions)" ]; then
            echo "No new edition to publish."
            exit 0
          fi
          git config user.name "Daily Dispatch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/editions
          git commit -m "Print edition for $(TZ=America/New_York date +%F)"
          # Someone may have pushed while the edition was being researched.
          # Replay the edition commit on top of the latest main, then push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1
