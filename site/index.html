<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noah's Daily Dispatch</title>
<meta name="description" content="A daily newspaper of the biggest stories in tech, business, world affairs, opinion and sports, each linked to its source.">

<meta property="og:site_name" content="Noah's Daily Dispatch">
<meta property="og:title" content="Noah's Daily Dispatch">
<meta property="og:description" content="The day's biggest stories in tech, business, world affairs, opinion and sports, each linked to its source.">
<meta property="og:url" content="https://daily-dispatch.v6czrt6rjr.workers.dev/">
<meta property="og:image" content="https://daily-dispatch.v6czrt6rjr.workers.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Noah's Daily Dispatch masthead in blackletter type">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a broadsheet front page. Masthead, lead story across the top, section bands below; archive is a ledger of past editions. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --paper: #f2ecdc;
  --ink: #1d1a15;
  --ink-soft: #4a443a;
  --rule: #1d1a15;
  --rule-faint: #b9ad93;
  --accent: #7a1f14;
  --f-mast: "UnifrakturMaguntia", "Old English Text MT", Georgia, serif;
  --f-head: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
  --f-body: "Old Standard TT", "Times New Roman", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b1915; --ink: #e9e1cd; --ink-soft: #b3aa96; --rule: #e9e1cd; --rule-faint: #4d473c; --accent: #d9846f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1b1915; --ink: #e9e1cd; --ink-soft: #b3aa96; --rule: #e9e1cd; --rule-faint: #4d473c; --accent: #d9846f; color-scheme: dark }

body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.sheet { max-width: 1180px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Masthead */
.ears { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); }
.mast { text-align: center; font-family: var(--f-mast); font-weight: 400; font-size: clamp(40px, 9vw, 104px); line-height: 1; margin: 8px 0 12px; text-wrap: balance; }
.mast a { text-decoration: none; }
.dateline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px;
  border-top: 3px double var(--rule); border-bottom: 3px double var(--rule); padding: 6px 2px;
  font-size: 13px; text-transform: uppercase; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.dateline nav { display: flex; gap: 16px; }
.dateline nav a { text-decoration: none; border-bottom: 1px solid transparent; }
.dateline nav a[aria-current="page"] { border-bottom-color: var(--ink); }
.dateline nav a:hover { color: var(--accent); }

/* Lead story */
.lead { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--accent); font-weight: 700; margin: 0 0 6px; }
.lead h2 { font-family: var(--f-head); font-weight: 900; font-size: clamp(32px, 5vw, 54px); line-height: 1.04; margin: 0 0 10px; text-wrap: balance; }
.lead h2 a, .story h3 a { text-decoration: none; }
.lead h2 a:hover, .story h3 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.deck { font-family: var(--f-head); font-style: italic; font-weight: 700; font-size: 20px; line-height: 1.3; margin: 0; color: var(--ink-soft); text-wrap: balance; }
.lead .summary { font-size: 18px; margin: 0; columns: 2 220px; column-gap: 24px; column-rule: 1px solid var(--rule-faint); }
.lead .summary::first-letter { font-family: var(--f-head); font-weight: 900; float: left; font-size: 3.4em; line-height: .82; padding: 6px 8px 0 0; }

/* Sections: stacked bands, stories set in columns across each band */
.section { padding-top: 22px; border-bottom: 1px solid var(--rule); }
.section > h2 { display: flex; align-items: center; gap: 14px; font-family: var(--f-head); font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: .2em;
  margin: 0; }
.section > h2::before, .section > h2::after { content: ""; flex: 1; border-top: 3px double var(--rule); }
.stories { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.story { padding: 14px 18px 18px; border-left: 1px solid var(--rule-faint); min-width: 0; }
.story:first-child { padding-left: 0; border-left: 0; }
.story:last-child { padding-right: 0; }
.story h3 { font-family: var(--f-head); font-weight: 700; font-size: 22px; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
.story .author { font-size: 13px; font-style: italic; color: var(--ink-soft); margin: -2px 0 6px; }
.section.opinion .story h3 { font-style: italic; }
.summary { margin: 0; text-align: justify; hyphens: auto; }
.byline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.byline a { color: var(--accent); text-decoration: none; white-space: nowrap; }
.byline a:hover { text-decoration: underline; }
.ai-note { text-align: center; font-size: 12px; font-style: italic; color: var(--ink-soft); border-top: 3px double var(--rule); margin-top: 18px; padding-top: 10px; }

/* Archive */
.archive h2 { font-family: var(--f-head); font-weight: 900; font-size: clamp(30px, 5vw, 44px); text-align: center; margin: 24px 0 2px; }
.archive .sub { text-align: center; font-style: italic; color: var(--ink-soft); margin: 0 0 18px; }
.ledger { list-style: none; margin: 0 auto; padding: 0; max-width: 820px; border-top: 2px solid var(--rule); }
.ledger li { border-bottom: 1px solid var(--rule-faint); }
.ledger a { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 4px 18px; padding: 14px 4px; text-decoration: none; }
.ledger a:hover .l-head { text-decoration: underline; text-underline-offset: 3px; }
.l-date { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 4px; }
.l-head { font-family: var(--f-head); font-weight: 700; font-size: 21px; line-height: 1.2; }
.l-meta { grid-column: 2; font-size: 14px; color: var(--ink-soft); font-style: italic; }
.back { display: inline-block; margin-top: 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); text-decoration: none; }
.empty { text-align: center; padding: 64px 12px; max-width: 34em; margin: 0 auto; }
.empty p:first-child { font-family: var(--f-head); font-weight: 700; font-size: 26px; margin: 0 0 8px; }
.empty p { color: var(--ink-soft); }

@media (max-width: 860px) {
  .stories { grid-template-columns: minmax(0, 1fr); }
  .story { padding: 14px 0; border-left: 0; border-bottom: 1px solid var(--rule-faint); }
  .story:last-child { border-bottom: 0; }
}
@media (max-width: 640px) {
  .lead { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .ears span:last-child { display: none; }
  .ledger a { grid-template-columns: minmax(0, 1fr); }
  .l-meta { grid-column: 1; }
}
</style>
</head>
<body>
<div class="sheet">
  <div class="ears"><span>Tech · Business · World · Opinion · Sports</span><span>Every story linked to its source</span></div>
  <h1 class="mast"><a href="#">Noah’s Daily Dispatch</a></h1>
  <div class="dateline">
    <span id="dl-date">Loading edition…</span>
    <nav aria-label="Pages"><a href="#" id="nav-today">Today’s Edition</a><a href="#archive" id="nav-archive">Past Editions</a></nav>
    <span id="dl-no"></span>
  </div>
  <main id="view"></main>
</div>

<script>
const SECTIONS = [["tech", "Technology & A.I."], ["business", "Business & Markets"], ["world", "World Affairs"], ["opinion", "Opinion"], ["sports", "Sports"]];
let index = [];      // [{date, number, headline, stories}], newest first
const cache = {};    // date -> full edition
let loaded = false;
let failed = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";

function longDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}
function shortDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function storyHTML(s) {
  return `<article class="story">
    <h3><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.headline)}</a></h3>
    ${s.author ? `<p class="author">By ${esc(s.author)}</p>` : ""}
    <p class="summary">${esc(s.summary)}</p>
    <div class="byline"><span>${esc(s.source)}</span><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">Read the full story →</a></div>
  </article>`;
}

function editionHTML(e, isPast) {
  const L = e.lead;
  const lead = L ? `<section class="lead">
      <div>
        <p class="kicker">${esc(L.kicker || "Top Story")}</p>
        <h2><a href="${esc(safeUrl(L.url))}" target="_blank" rel="noopener">${esc(L.headline)}</a></h2>
        ${L.deck ? `<p class="deck">${esc(L.deck)}</p>` : ""}
      </div>
      <div>
        <p class="summary">${esc(L.summary)}</p>
        <div class="byline"><span>${esc(L.source)}</span><a href="${esc(safeUrl(L.url))}" target="_blank" rel="noopener">Read the full story →</a></div>
      </div>
    </section>` : "";
  const cols = SECTIONS.map(([k, name]) => {
    const stories = (e.sections && e.sections[k]) || [];
    if (!stories.length) return "";
    return `<section class="section ${k}"><h2>${name}</h2><div class="stories">${stories.map(storyHTML).join("")}</div></section>`;
  }).join("");
  return `${isPast ? `<a class="back" href="#archive">← All past editions</a>` : ""}
    ${lead}${cols}
    <p class="ai-note">Summaries are written by A.I. from the linked reporting. Opinion pieces reflect their authors’ views. Follow each link for the full story from its publisher.</p>`;
}

function archiveHTML() {
  const past = index.slice(1);
  if (!past.length) return `<section class="archive"><h2>Past Editions</h2>
    <div class="empty"><p>No back issues yet.</p><p>Each morning’s paper moves here when the next one is printed. Today’s edition is the first.</p></div></section>`;
  return `<section class="archive"><h2>Past Editions</h2><p class="sub">${past.length} back issue${past.length === 1 ? "" : "s"} on file</p>
    <ul class="ledger">${past.map((e) => `<li><a href="#e-${esc(e.date)}"><span class="l-date">${esc(shortDate(e.date))}</span>
        <span class="l-head">${esc(e.headline || "Edition of " + longDate(e.date))}</span>
        <span class="l-meta">No. ${esc(e.number ?? "")} · ${esc(e.stories ?? "")} stories</span></a></li>`).join("")}</ul></section>`;
}

async function loadEdition(date) {
  if (cache[date]) return cache[date];
  const r = await fetch(`editions/${date}.json`, { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return (cache[date] = await r.json());
}

function setNav(h) {
  const past = h === "archive" || h.startsWith("e-");
  past ? $("#nav-today").removeAttribute("aria-current") : $("#nav-today").setAttribute("aria-current", "page");
  past ? $("#nav-archive").setAttribute("aria-current", "page") : $("#nav-archive").removeAttribute("aria-current");
}

async function render() {
  const h = location.hash.replace(/^#/, "");
  const view = $("#view");
  setNav(h);

  if (failed) {
    $("#dl-date").textContent = "Edition unavailable";
    view.innerHTML = `<div class="empty"><p>The presses can’t be reached.</p><p>Today’s paper couldn’t be loaded. Refresh the page to try again.</p></div>`;
    return;
  }
  if (!loaded) { view.innerHTML = `<div class="empty"><p>Setting type…</p><p>Fetching today’s edition.</p></div>`; return; }
  if (!index.length) {
    $("#dl-date").textContent = "No editions yet";
    view.innerHTML = `<div class="empty"><p>The first edition hasn’t gone to press.</p><p>A new paper is printed every morning. Check back after the next run.</p></div>`;
    return;
  }
  if (h === "archive") {
    $("#dl-date").textContent = "The Morgue";
    $("#dl-no").textContent = `${index.length} editions printed`;
    view.innerHTML = archiveHTML();
    return;
  }

  let entry = index[0];
  if (h.startsWith("e-")) entry = index.find((x) => x.date === h.slice(2)) || index[0];
  try {
    const e = await loadEdition(entry.date);
    if (location.hash.replace(/^#/, "") !== h) return; // reader navigated away meanwhile
    $("#dl-date").textContent = longDate(e.date);
    $("#dl-no").textContent = `Vol. I · No. ${e.number ?? ""}`;
    view.innerHTML = editionHTML(e, entry !== index[0]);
  } catch {
    view.innerHTML = `<div class="empty"><p>That edition is missing from the morgue.</p><p><a href="#">Return to today’s paper</a></p></div>`;
  }
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();

fetch("editions/index.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((list) => { index = list.sort((a, b) => b.date.localeCompare(a.date)); loaded = true; render(); })
  .catch(() => { failed = true; render(); });
</script>
</body>
</html>
